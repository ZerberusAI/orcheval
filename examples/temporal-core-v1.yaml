version: 1

evaluation:
  name: temporal-core-v1-reference

profile:
  id: ai-orchestration

targets:
  - temporal

gates:
  security-baseline:
    required: true

metrics:
  latency:
    enabled: true
  throughput:
    enabled: true
  burst:
    enabled: true
  traceability:
    enabled: true
  resources:
    enabled: true
  cost:
    enabled: true

runs:
  repetitions: 3
  warmup: 1
  seed: 20261007

load:
  concurrency:
    - 1
    - 5

faults:
  - transient_failure
  - worker_kill
