version: 1

evaluation:
  name: orchestration-runtime-evaluation

profile:
  id: ai-orchestration

targets:
  - temporal
  - hatchet
  - inngest
  - triggerdev
  - windmill

gates:
  security-baseline:
    required: true

metrics:
  latency:
    enabled: true
  throughput:
    enabled: true
  burst:
    enabled: true
  traceability:
    enabled: true

runs:
  repetitions: 3

load:
  concurrency:
    - 1
    - 10
    - 50

faults:
  - transient_failure
  - worker_kill
